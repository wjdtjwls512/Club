        <form>
            <input type="text" placeholder="Search...">
            <button type="submit">

            </button>
        </form>
        <div id="headerUserInfo">
        </div>
        <div id="moreUserInfo" class="inVisible">
            <img src="images/profile.svg" alt="프로필">
            <p id="moreUserInfoName"></p>
            <a href="#" id="logOutButton">log out</a>
        </div>
    </header>
    <main>
        <h2>Create Post</h2>
        <div id="Post">
            <div id="userFlex">
                <div class="user">
                    <img src="images/profile.svg" id="pika-img">
                    <p>USERNAME</p>
                </div>
                <button id="post-button">Post</button>
            </div>
            <input type="text" placeholder="title..." id="titleInput">
            <textarea id="userInput" placeholder="what do you want talk about?"></textarea>
        </div>
    </main>
    <script type="module" src="all.js"></script>
    <script type="module" src="create.js"></script>
