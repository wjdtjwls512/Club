<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="all.css">
    <link rel="stylesheet" href="create.css">
    <link rel="stylesheet" href="view.css">
    <link rel="icon" href="images/favicon.svg">
    <title>Document</title>
</head>
<body>
    <header>
        <a id="homeLink" href="main.html"><h1><img src="images/logo.svg" alt="logo">PokeForum</h1></a>
        <form>
            <input type="text" placeholder="Search...">
            <button type="submit">
                <svg width="34" height="36" viewBox="0 0 34 36" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M16.4473 0C25.5311 0 32.8955 7.37425 32.8955 16.4707C32.8954 20.5391 31.4208 24.262 28.9795 27.1357L33.5527 32.9404L33.5508 32.9414C33.7578 33.2169 33.8828 33.5584 33.8828 33.9297C33.8826 34.839 33.1463 35.5759 32.2383 35.5762C31.7287 35.5762 31.2734 35.3438 30.9717 34.9795L30.9707 34.9814L26.5977 29.4316C23.802 31.63 20.2774 32.9414 16.4473 32.9414C7.36384 32.941 0.00014237 25.5668 0 16.4707C0 7.37448 7.36375 0.000383464 16.4473 0ZM16.4473 3.29395C9.18052 3.29432 3.28906 9.19377 3.28906 16.4707C3.28921 23.7475 9.1806 29.6471 16.4473 29.6475C23.7142 29.6475 29.6053 23.7477 29.6055 16.4707C29.6055 9.19354 23.7143 3.29395 16.4473 3.29395Z" fill="white"/>
                </svg>
            </button>
        </form>
        <div id="headerUserInfo">
        </div>
        <div id="moreUserInfo" class="inVisible">
            <img src="images/profile.svg" alt="프로필">
            <p id="moreUserInfoName"></p>
            <a href="#" id="logOutButton">log out</a>
        </div>
    </header>
    <main>
        <h2>View Post</h2>
        <div id="main">
            <div class="info" id="left-info">
                <div class="user">
                    <img src="images/profile.svg" id="pika-img">
                    <p>USERNAME</p>
                    <span class="comment-date" id="postDate"></span>
                </div>
                <h2 id="postTitle">포켓몬 모르는 사람들을 위한 상성에 대하여</h2>
                <p>포켓몬 타입별로 상성을 쉽게 이해하게 해주는 도움말들이다.<br>효과가 굉장하다의 경우 특정 타입의 모티브인 물체가 파괴될 정도의<br>상호작용을 기준으로 한다. 예를 들어 불꽃이 풀(식물)을 태워 재로 만들거나, <br>물이 불꽃을 끄는 것, 혹은 지진(땅)이 바위를 무너뜨리는 것처럼 <br>자연계의 물리적인 상극 관계를 떠올리면 이해하기 쉽다.</p>
                <div class="icon" id="icon1">
                    <svg xmlns="http://www.w3.org/2000/svg" width="25" height="25" viewBox="0 0 25 25" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" class="left-info-icon">
                        <path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/>
                    </svg>
                    <p>127</p>
                </div>
                <div class="icon" id="icon2">
                    <svg xmlns="http://www.w3.org/2000/svg" width="25" height="25" viewBox="0 0 25 25" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" class="left-info-icon">
                        <path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/>
                    </svg>
                    <p>10,923</p>
                </div>
                <div id="editDel">
                </div>
            </div> 
            <div class="info" id="right-info">
                <div id="inputDiv">
                    <img src="images/profile.svg" id="min-pika-img">
                    <input placeholder="Add comment...">
                    <button>send</button>
                </div>
            </div>
        </div>
    </main>
    <script type="module" src="all.js"></script>
    <script type="module" src="./view.js"></script>
</body>
</html>
